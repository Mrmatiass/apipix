<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento via PIX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        #codigoPix {
            font-size: 16px;
            font-family: monospace;
            margin: 20px 0;
            word-wrap: break-word;
        }
        .button {
            background-color: #e91e63;
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #c2185b;
        }
        #codigoPixInput {
            position: absolute;
            left: -9999px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pagamento via PIX</h1>
        <div id="codigoPix">Gerando código Pix...</div>
        <button class="button" id="copiarButton">Copiar Código Pix</button>
        <input type="text" id="codigoPixInput">
    </div>

    <script>
        async function obterCodigoPix() {
            try {
                // Ler os parâmetros da URL
                const urlParams = new URLSearchParams(window.location.search);
                const valor = urlParams.get('valor') || 9.99; // Valor padrão caso não seja enviado
                const token = urlParams.get('token'); // Token enviado pelo Typebot

                if (!token) {
                    document.getElementById('codigoPix').innerText = 'Token de autenticação não fornecido.';
                    return;
                }

                // Fazer a requisição para a API
                const response = await fetch('https://api.pushinpay.com.br/api/pix/cashIn', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        value: parseFloat(valor),
                        webhook_url: 'https://SEU_WEBHOOK_REAL'
                    })
                });

                const data = await response.json();
                document.getElementById('codigoPix').innerText = data.qr_code || 'Código não disponível';

                // Opcional: Notificar o webhook sobre o pagamento pendente
                const paymentId = data.id;
                if (paymentId) {
                    await fetch('https://SEU_WEBHOOK_DE_CONFIRMACAO', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            paymentId: paymentId,
                            status: 'pendente'
                        })
                    });
                }
            } catch (error) {
                console.error('Erro ao obter o código Pix:', error);
                document.getElementById('codigoPix').innerText = 'Erro ao gerar código Pix.';
            }
        }

        function copiarCodigo() {
            const codigo = document.getElementById('codigoPix').innerText;
            const input = document.getElementById('codigoPixInput');
            input.value = codigo;
            input.select();
            document.execCommand('copy');
            alert('Código PIX copiado com sucesso!');
        }

        // Executar a função ao carregar a página
        window.onload = obterCodigoPix;
        document.getElementById('copiarButton').onclick = copiarCodigo;
    </script>
</body>
</html>
